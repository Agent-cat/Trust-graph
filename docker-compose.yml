services:
  postgres:
    image: postgres:17
    container_name: trustgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustgraph
      POSTGRES_PASSWORD: trustgraph
      POSTGRES_DB: trustgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
